<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>キオクシア & 日経平均 リアルタイムモニター</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVGを使った安定版軽量グラフコンポーネント
    function SimpleChart({ data }) {
      if (!data || data.length === 0) return <div className="text-center py-10 text-gray-400">データがありません</div>;
      
      const width = 600;
      const height = 200;
      const padding = 30;

      const prices = data.map(d => d.price);
      const minP = Math.min(...prices);
      const maxP = Math.max(...prices);
      
      const points = data.map((d, i) => {
        const x = padding + (i / Math.max(data.length - 1, 1)) * (width - padding * 2);
        const y = height - padding - ((d.price - minP) / (maxP - minP || 1)) * (height - padding * 2);
        return `${x},${y}`;
      }).join(' ');

      return (
        <div className="w-full overflow-x-auto">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto">
            <line x1={padding} y1={padding} x2={width - padding} y2={padding} stroke="#e5e7eb" strokeDasharray="4" />
            <line x1={padding} y1={height / 2} x2={width - padding} y2={height / 2} stroke="#e5e7eb" strokeDasharray="4" />
            <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#e5e7eb" strokeDasharray="4" />
            
            <polyline fill="none" stroke="#2563eb" strokeWidth="3" points={points} />
            
            {data.map((d, i) => {
              const x = padding + (i / Math.max(data.length - 1, 1)) * (width - padding * 2);
              const y = height - padding - ((d.price - minP) / (maxP - minP || 1)) * (height - padding * 2);
              return (
                <g key={i}>
                  <circle cx={x} cy={y} r="4" fill="#2563eb" />
                  <text x={x} y={height - 10} fontSize="10" textAnchor="middle" fill="#6b7280">{d.time}</text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    function StockDashboard() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('av_api_key') || '');
      const [showKeyInput, setShowKeyInput] = useState(false);
      
      const [kioxiaPrice, setKioxiaPrice] = useState(56010); // 初期値
      const [kioxiaChange, setKioxiaChange] = useState({ amount: -5870, percent: '-9.49' });
      const [chartData, setChartData] = useState([
        { time: '09:00', price: 60880 },
        { time: '11:30', price: 62690 },
        { time: '12:30', price: 55080 },
        { time: '15:00', price: 56010 }
      ]);

      const [isLoading, setIsLoading] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString());

      // 保有状況の状態管理
      const [buyPrice, setBuyPrice] = useState(() => localStorage.getItem('kioxia_buyPrice') || '50000');
      const [shares, setShares] = useState(() => localStorage.getItem('kioxia_shares') || '100');

      // Alpha Vantageから株価を取得する関数
      const fetchStockData = async () => {
        if (!apiKey) {
          alert('APIキーが設定されていません。「APIキー設定」から入力してください。');
          return;
        }

        setIsLoading(true);
        try {
          // キオクシア（285A.T）の最新株価を取得
          const response = await fetch(
            `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=285A.T&apikey=${apiKey}`
          );
          const result = await response.json();

          if (result['Global Quote'] && result['Global Quote']['05. price']) {
            const quote = result['Global Quote'];
            const price = parseFloat(quote['05. price']);
            const change = parseFloat(quote['09. change']);
            const changePercent = quote['10. change percent'].replace('%', '');

            setKioxiaPrice(price);
            setKioxiaChange({
              amount: change,
              percent: parseFloat(changePercent).toFixed(2)
            });
            setLastUpdated(new Date().toLocaleTimeString());
          } else {
            alert('株価データの取得に失敗しました。APIキーが正しいか、または1日の取得制限（25回まで）を超えていないか確認してください。');
          }
        } catch (error) {
          console.error('通信エラー:', error);
          alert('ネットワークエラーが発生しました。');
        } finally {
          setIsLoading(false);
        }
      };

      // 初回起動時に自動取得
      useEffect(() => {
        if (apiKey) {
          fetchStockData();
        }
      }, []);

      const handleSaveApiKey = (e) => {
        e.preventDefault();
        localStorage.setItem('av_api_key', apiKey);
        setShowKeyInput(false);
        fetchStockData();
      };

      const handleBuyPriceChange = (e) => {
        setBuyPrice(e.target.value);
        localStorage.setItem('kioxia_buyPrice', e.target.value);
      };

      const handleSharesChange = (e) => {
        setShares(e.target.value);
        localStorage.setItem('kioxia_shares', e.target.value);
      };

      // 資産計算
      const numShares = parseFloat(shares) || 0;
      const numBuyPrice = parseFloat(buyPrice) || 0;
      const totalInvestment = numShares * numBuyPrice;
      const currentEvaluation = numShares * kioxiaPrice;
      const totalProfit = currentEvaluation - totalInvestment;
      const profitPercent = totalInvestment > 0 ? ((totalProfit / totalInvestment) * 100).toFixed(2) : '0.00';

      return (
        <div className="max-w-4xl mx-auto p-4 font-sans min-h-screen">
          {/* ヘッダー */}
          <header className="flex justify-between items-center mb-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
              <h1 className="text-xl font-bold text-gray-800">キオクシア (285A) リアルタイムモニター</h1>
              <p className="text-xs text-gray-500">
                最終更新: {lastUpdated} <span className="text-blue-500 ml-1">(15分ディレイ)</span>
              </p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setShowKeyInput(!showKeyInput)}
                className="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600 text-xs transition"
              >
                ⚙️ APIキー設定
              </button>
              <button
                onClick={fetchStockData}
                disabled={isLoading}
                className="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition text-xs font-bold flex items-center gap-1 cursor-pointer disabled:bg-gray-400"
              >
                {isLoading ? '取得中...' : '🔄 最新情報に更新'}
              </button>
            </div>
          </header>

          {/* APIキー入力設定パネル */}
          {showKeyInput && (
            <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-200 mb-6">
              <h3 className="text-sm font-bold text-yellow-800 mb-2">Alpha Vantage APIキーの設定</h3>
              <form onSubmit={handleSaveApiKey} className="flex gap-2">
                <input
                  type="text"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="発行したAPIキーを貼り付け"
                  className="flex-1 p-2 border border-gray-300 rounded-lg text-sm bg-white"
                />
                <button type="submit" className="px-4 py-2 bg-yellow-600 text-white font-bold rounded-lg text-sm">
                  保存して通信
                </button>
              </form>
            </div>
          )}

          {/* 株価サマリー */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
              <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">東証 (285A)</span>
              <h2 className="text-lg font-bold text-gray-700">キオクシアホールディングス</h2>
              <div className="flex items-baseline gap-3 mt-2">
                <span className="text-3xl font-black text-gray-900">
                  ¥{kioxiaPrice.toLocaleString()}
                </span>
                <span className={`text-sm font-bold ${kioxiaChange.amount >= 0 ? 'text-red-500' : 'text-green-600'}`}>
                  {kioxiaChange.amount >= 0 ? `▲ +${kioxiaChange.amount}` : `▼ ${kioxiaChange.amount}`} ({kioxiaChange.percent}%)
                </span>
              </div>
            </div>

            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
              <span className="text-xs font-bold text-emerald-600 uppercase tracking-wider">市場指標</span>
              <h2 className="text-lg font-bold text-gray-700">日経平均株価 (目安)</h2>
              <div className="flex items-baseline gap-3 mt-2">
                <span className="text-3xl font-black text-gray-900">
                  ¥39,600
                </span>
                <span className="text-sm font-bold text-red-500">
                  ▲ +100 (0.25%)
                </span>
              </div>
            </div>
          </div>

          {/* 保有資産・損益管理パネル */}
          <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
            <h3 className="text-md font-bold text-gray-800 mb-4 flex items-center gap-2">
              💰 キオクシア保有・損益シミュレーション
            </h3>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 bg-gray-50 p-4 rounded-lg">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">平均購入単価 (円)</label>
                <input
                  type="number"
                  value={buyPrice}
                  onChange={handleBuyPriceChange}
                  placeholder="例: 50000"
                  className="w-full p-2 border border-gray-300 rounded-lg text-sm bg-white"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">保有株数 (株)</label>
                <input
                  type="number"
                  value={shares}
                  onChange={handleSharesChange}
                  placeholder="例: 100"
                  className="w-full p-2 border border-gray-300 rounded-lg text-sm bg-white"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                <span className="text-xs text-gray-500 block">総投資金額</span>
                <span className="text-base font-bold text-gray-800">
                  ¥{totalInvestment.toLocaleString()}
                </span>
              </div>
              <div className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                <span className="text-xs text-gray-500 block">現在の評価額</span>
                <span className="text-base font-bold text-gray-800">
                  ¥{currentEvaluation.toLocaleString()}
                </span>
              </div>
              <div className={`p-3 rounded-lg border ${totalProfit >= 0 ? 'bg-red-50 border-red-200' : 'bg-green-50 border-green-200'}`}>
                <span className="text-xs text-gray-500 block">評価損益（儲け額）</span>
                <span className={`text-base font-bold ${totalProfit >= 0 ? 'text-red-600' : 'text-green-600'}`}>
                  {totalProfit >= 0 ? `+¥${totalProfit.toLocaleString()}` : `-¥${Math.abs(totalProfit).toLocaleString()}`}
                  <span className="text-xs ml-1">({profitPercent}%)</span>
                </span>
              </div>
            </div>
          </div>

          {/* チャートエリア */}
          <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
            <h3 className="text-md font-bold text-gray-800 mb-2">株価推移イメージ</h3>
            <SimpleChart data={chartData} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StockDashboard />);
  </script>
</body>
</html>
