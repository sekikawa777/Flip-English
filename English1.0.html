<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英会話復習＆発音採点アプリ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 16px;
            text-align: center;
        }
        h1 {
            font-size: 1.1rem;
            color: #333;
            margin: 0 0 10px 0;
        }
        /* カテゴリー選択のスタイル */
        .category-select-container {
            margin-bottom: 10px;
            text-align: left;
        }
        .category-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #495057;
            margin-bottom: 3px;
            display: block;
        }
        .category-select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #007bff;
            background-color: #f8f9fa;
            font-size: 0.9rem;
            font-weight: bold;
            color: #007bff;
            outline: none;
            cursor: pointer;
        }
        /* モード切替ボタン */
        .mode-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .mode-btn.active {
            background: #007bff;
            color: white;
        }
        /* 速度調整 */
        .rate-control {
            background: #e9ecef;
            border-radius: 8px;
            padding: 6px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #495057;
            font-weight: bold;
        }
        .rate-control input[type=range] {
            flex: 1;
            margin: 0 10px;
            cursor: pointer;
        }
        /* カードスタイル */
        .card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px 12px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .japanese {
            font-size: 1rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 8px;
        }
        .english {
            font-size: 1rem;
            color: #28a745;
            font-weight: bold;
            display: none;
        }
        /* 発音ヒント・IPA用スタイル */
        .phonetic-hint {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 4px;
            display: none;
        }
        .hint {
            font-size: 0.75rem;
            color: #888;
            margin-top: 6px;
        }
        /* 発音判定セクション */
        .speech-section {
            background: #f1f3f5;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .mic-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .mic-btn.recording {
            background: #ffc107;
            color: #212529;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .speech-result {
            margin-top: 6px;
            font-size: 0.8rem;
            color: #495057;
            line-height: 1.3;
        }
        .score-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
        }
        .score-100 { background: #d4edda; color: #155724; }
        .score-good { background: #cce5ff; color: #004085; }
        .score-try { background: #fff3cd; color: #856404; }

        /* クイズスタイル */
        .quiz-option {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .quiz-option:hover { background: #e2e6ea; }
        .quiz-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .quiz-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        /* コントロール */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .nav-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .shuffle-btn {
            background: #ffc107;
            color: #212529;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
            font-size: 0.9rem;
        }
        .audio-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>英会話フレーズ学習</h1>
    
    <!-- カテゴリー選択ドロップダウン -->
    <div class="category-select-container">
        <label class="category-label" for="category-select">📁 カテゴリーを選択:</label>
        <select id="category-select" class="category-select" onchange="changeCategory(this.value)">
            <option value="shopping">🛒 ショッピング (100選)</option>
            <option value="travel">✈️ 旅行・交通 (100選)</option>
            <option value="daily">💬 日常会話 (100選)</option>
            <option value="business">💼 ビジネス (100選)</option>
        </select>
    </div>

    <div class="mode-buttons">
        <button class="mode-btn active" onclick="switchMode('flashcard')">暗記カード</button>
        <button class="mode-btn" onclick="switchMode('quiz')">4択クイズ</button>
    </div>

    <!-- 速度調整スライダー -->
    <div class="rate-control">
        <span>再生速度:</span>
        <input type="range" id="speech-rate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateRateLabel(this.value)">
        <span id="rate-value">1.0x</span>
    </div>

    <button class="shuffle-btn" onclick="shuffleCurrentData()">🔀 順番をシャッフルする</button>

    <div id="progress" style="margin-bottom: 8px; font-size: 0.85rem; color: #666;">1 / 100</div>

    <!-- 暗記カードモード -->
    <div id="flashcard-mode">
        <div class="card" onclick="toggleAnswer()">
            <div class="japanese" id="fc-japanese"></div>
            <div class="english" id="fc-english"></div>
            <div class="phonetic-hint" id="fc-phonetic"></div>
            <div class="hint" id="fc-hint">タップで答えを表示</div>
        </div>

        <!-- 発音判定セクション -->
        <div class="speech-section">
            <button class="mic-btn" id="mic-btn" onclick="toggleSpeechRecognition()">🎤 発音をチェックする</button>
            <div class="speech-result" id="speech-result">ボタンを押して英語を発音してください</div>
            <div id="score-container"></div>
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="prevCard()">前へ</button>
            <button class="audio-btn" onclick="speakCurrent()" title="お手本">🔊</button>
            <button class="copy-btn" onclick="copyCurrentText()" title="コピー">📋</button>
            <button class="nav-btn" onclick="nextCard()">次へ</button>
        </div>
    </div>

    <!-- クイズモード -->
    <div id="quiz-mode" style="display: none;">
        <div class="japanese" id="quiz-japanese" style="margin-bottom: 15px;"></div>
        <div id="quiz-options"></div>
        <div class="controls" style="margin-top: 15px;">
            <button class="nav-btn" onclick="prevQuiz()">前へ</button>
            <button class="nav-btn" onclick="nextQuiz()">次へ</button>
        </div>
    </div>
</div>

let currentCategory = 'shopping';
let originalData = [...categoryData[currentCategory]];
let data = [...originalData];
let currentIndex = 0;
let isAnswerShown = false;
let currentMode = 'flashcard';

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onstart = () => {
        isRecording = true;
        const btn = document.getElementById('mic-btn');
        btn.innerText = '🔴 録音中...（話してください）';
        btn.classList.add('recording');
        document.getElementById('speech-result').innerText = '聞き取り中...';
        document.getElementById('score-container').innerHTML = '';
    };

    recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        evaluatePronunciation(spokenText);
    };

    recognition.onerror = (event) => {
        const isSecure = window.isSecureContext;
        if (!isSecure) {
            document.getElementById('speech-result').innerHTML = '<span style="color:#dc3545;">⚠️ ローカルファイルではセキュリティ制限によりマイクが使えません。<br>https://環境でご利用ください。</span>';
        } else if (event.error === 'not-allowed') {
            document.getElementById('speech-result').innerText = 'マイクの使用が許可されていません。';
        } else {
            document.getElementById('speech-result').innerText = '認識エラーが発生しました。';
        }
        resetMicButton();
    };

    recognition.onend = () => {
        resetMicButton();
    };
}

function resetMicButton() {
    isRecording = false;
    const btn = document.getElementById('mic-btn');
    if (btn) {
        btn.innerText = '🎤 発音をチェックする';
        btn.classList.remove('recording');
    }
}

function toggleSpeechRecognition() {
    if (!recognition) {
        alert('お使いのブラウザは音声認識に対応していません。');
        return;
    }
    if (!window.isSecureContext) {
        alert('ローカル環境ではマイク機能がブロックされます。https://サーバー上でお使いください。');
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        recognition.start();
    }
}

function changeCategory(catKey) {
    window.speechSynthesis.cancel();
    currentCategory = catKey;
    originalData = [...categoryData[currentCategory]];
    data = [...originalData];
    currentIndex = 0;
    if (currentMode === 'flashcard') {
        updateFlashcard();
    } else {
        updateQuiz();
    }
}

function calculateSimilarity(str1, str2) {
    const clean1 = str1.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
    const clean2 = str2.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
    const words1 = clean1.split(/\s+/);
    const words2 = clean2.split(/\s+/);
    let matchCount = 0;
    words1.forEach(w => {
        if (words2.includes(w)) matchCount++;
    });
    const score = Math.round((matchCount / Math.max(words1.length, words2.length)) * 100);
    return { score, recognizedText: clean1 };
}

function evaluatePronunciation(spokenText) {
    const targetText = data[currentIndex].en;
    const { score } = calculateSimilarity(spokenText, targetText);
    const resultElem = document.getElementById('speech-result');
    resultElem.innerHTML = `認識結果: <strong>"${spokenText}"</strong>`;
    const scoreContainer = document.getElementById('score-container');
    let badgeClass = 'score-try';
    let label = 'Try Again! 💪';
    if (score >= 85) {
        badgeClass = 'score-100';
        label = 'Perfect!! 🎉';
    } else if (score >= 60) {
        badgeClass = 'score-good';
        label = 'Good Job! 👍';
    }
    scoreContainer.innerHTML = `<div class="score-badge ${badgeClass}">${score}点 - ${label}</div>`;
}

function updateRateLabel(val) {
    document.getElementById('rate-value').innerText = parseFloat(val).toFixed(1) + 'x';
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function shuffleCurrentData() {
    shuffleArray(data);
    currentIndex = 0;
    if (currentMode === 'flashcard') {
        updateFlashcard();
    } else {
        updateQuiz();
    }
}

function resetSpeechUI() {
    if (recognition && isRecording) recognition.stop();
    document.getElementById('speech-result').innerText = 'ボタンを押して英語を発音してください';
    document.getElementById('score-container').innerHTML = '';
}

function updateFlashcard() {
    resetSpeechUI();
    document.getElementById('progress').innerText = `${currentIndex + 1} / ${data.length}`;
    document.getElementById('fc-japanese').innerText = data[currentIndex].ja;
    document.getElementById('fc-english').innerText = data[currentIndex].en;
    document.getElementById('fc-phonetic').innerText = data[currentIndex].ipa || '';
    document.getElementById('fc-english').style.display = 'none';
    document.getElementById('fc-phonetic').style.display = 'none';
    document.getElementById('fc-hint').innerText = "タップで答えを表示";
    isAnswerShown = false;
}

function toggleAnswer() {
    const enElem = document.getElementById('fc-english');
    const phoneticElem = document.getElementById('fc-phonetic');
    const hintElem = document.getElementById('fc-hint');
    if (isAnswerShown) {
        enElem.style.display = 'none';
        phoneticElem.style.display = 'none';
        hintElem.innerText = "タップで答えを表示";
    } else {
        enElem.style.display = 'block';
        phoneticElem.style.display = 'block';
        hintElem.innerText = "タップで隠す";
        speakCurrent();
    }
    isAnswerShown = !isAnswerShown;
}

function nextCard() {
    window.speechSynthesis.cancel();
    currentIndex = (currentIndex + 1) % data.length;
    updateFlashcard();
}

function prevCard() {
    window.speechSynthesis.cancel();
    currentIndex = (currentIndex - 1 + data.length) % data.length;
    updateFlashcard();
}

function speakCurrent() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const text = data[currentIndex].en;
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'en-US';
    uttr.rate = parseFloat(document.getElementById('speech-rate').value);
    
    // ボイス割り当て処理
    const voices = window.speechSynthesis.getVoices();
    const englishVoice = voices.find(v => v.lang.startsWith('en'));
    if (englishVoice) uttr.voice = englishVoice;
    
    window.speechSynthesis.speak(uttr);
}

// 【追加】音声合成（TTS）のボイス読み込み非同期対応処理
if ('speechSynthesis' in window) {
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }
}

function copyCurrentText() {
    const textToCopy = data[currentIndex].en;
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("英語のフレーズをコピーしました！");
        }).catch(() => fallbackCopyText(textToCopy));
    } else {
        fallbackCopyText(textToCopy);
    }
}

function fallbackCopyText(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-999999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        document.execCommand('copy');
        alert("英語のフレーズをコピーしました！");
    } catch (err) {}
    document.body.removeChild(textArea);
}

function switchMode(mode) {
    window.speechSynthesis.cancel();
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'flashcard') {
        document.querySelectorAll('.mode-btn')[0].classList.add('active');
        document.getElementById('flashcard-mode').style.display = 'block';
        document.getElementById('quiz-mode').style.display = 'none';
        updateFlashcard();
    } else {
        document.querySelectorAll('.mode-btn')[1].classList.add('active');
        document.getElementById('flashcard-mode').style.display = 'none';
        document.getElementById('quiz-mode').style.display = 'block';
        updateQuiz();
    }
}

function updateQuiz() {
    document.getElementById('progress').innerText = `${currentIndex + 1} / ${data.length}`;
    document.getElementById('quiz-japanese').innerText = data[currentIndex].ja;
    const optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';
    
    let options = [data[currentIndex].en];
    let allPhrases = [];
    Object.keys(categoryData).forEach(k => {
        allPhrases = allPhrases.concat(categoryData[k]);
    });
    let otherData = allPhrases.filter(item => item.en !== data[currentIndex].en);
    shuffleArray(otherData);
    
    for (let i = 0; i < 3; i++) {
        options.push(otherData[i].en);
    }
    shuffleArray(options);
    
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => checkQuizAnswer(btn, opt === data[currentIndex].en);
        optionsContainer.appendChild(btn);
    });
}

function checkQuizAnswer(button, isCorrect) {
    const allOptions = document.querySelectorAll('.quiz-option');
    allOptions.forEach(opt => opt.style.pointerEvents = 'none');
    if (isCorrect) {
        button.classList.add('correct');
        speakCurrent();
    } else {
        button.classList.add('wrong');
        allOptions.forEach(opt => {
            if (opt.innerText === data[currentIndex].en) {
                opt.classList.add('correct');
            }
        });
    }
}

function nextQuiz() {
    window.speechSynthesis.cancel();
    currentIndex = (currentIndex + 1) % data.length;
    updateQuiz();
}

function prevQuiz() {
    window.speechSynthesis.cancel();
    currentIndex = (currentIndex - 1 + data.length) % data.length;
    updateQuiz();
}

// 初期実行
updateFlashcard();
</script>

</body>
</html>
